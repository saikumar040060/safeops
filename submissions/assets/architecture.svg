<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><rect width="1600" height="1100" fill="#0d1728"/><style>text{font-family:Arial,sans-serif;fill:#edf4ff}.t{font-size:34px;font-weight:700}.s{font-size:23px}.n{font-size:20px;fill:#b6c8df}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8ba8c9"/></marker></defs><text x="60" y="60" class="t">SafeOps | Existing authorization architecture</text><text x="60" y="98" class="n">Historical Strands run: Anthropic live model. Bedrock blocked; no AgentCore deployment claimed.</text><rect x="60" y="140" width="270" height="100" rx="15" fill="#203653"/><text x="80" y="176" class="s">User / CLI</text><text x="80" y="206" class="s">Task → response</text><rect x="390" y="140" width="640" height="100" rx="15" fill="#203653"/><text x="410" y="176" class="s">Strands Agent + Anthropic</text><text x="410" y="206" class="s">Reason → tool call → result → reason / response</text><path d="M330,175 L390,175" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M390,220 L330,220" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="1090" y="140" width="450" height="100" rx="15" fill="#203653"/><text x="1110" y="176" class="s">CALL-E outbound call</text><text x="1110" y="206" class="s">Structured confirmation outcome</text><rect x="390" y="300" width="640" height="90" rx="15" fill="#203653"/><text x="410" y="336" class="s">Five Strands tool wrappers</text><text x="410" y="366" class="s">Shared SafeOps client</text><path d="M710,240 L710,300" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="60" y="300" width="270" height="90" rx="15" fill="#203653"/><text x="80" y="336" class="s">MCP client</text><text x="80" y="366" class="s">Existing adapter</text><rect x="390" y="455" width="640" height="95" rx="15" fill="#203653"/><text x="410" y="491" class="s">Generic integration API</text><text x="410" y="521" class="s">ExternalActionService → AgentRuntime</text><path d="M710,390 L710,455" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1315,240 L1315,500" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1315,500 L1030,500" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M195,390 L195,500" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M195,500 L390,500" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="730" y="423" class="n">Results return to callers</text><rect x="390" y="610" width="640" height="105" rx="15" fill="#203653"/><text x="410" y="646" class="s">ToolGateway</text><text x="410" y="676" class="s">Permission → Policy* → Risk → Decision</text><path d="M710,550 L710,610" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="60" y="795" width="420" height="110" rx="15" fill="#144745"/><text x="80" y="831" class="s">ALLOW</text><text x="80" y="861" class="s">Demo tool executes</text><rect x="590" y="795" width="420" height="110" rx="15" fill="#534428"/><text x="610" y="831" class="s">REQUIRES_APPROVAL</text><text x="610" y="861" class="s">Human reviews → execute or reject</text><rect x="1120" y="795" width="420" height="110" rx="15" fill="#512d3c"/><text x="1140" y="831" class="s">BLOCK</text><text x="1140" y="861" class="s">No tool execution; incident as needed</text><path d="M530,715 L270,795" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M780,715 L800,795" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M970,715 L1330,795" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><rect x="60" y="965" width="1480" height="70" rx="15" fill="#203653"/><text x="80" y="1001" class="s">PostgreSQL: demo records + decision/audit records  →  Next.js operator dashboard / review</text><path d="M270,905 L270,965" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M800,905 L800,965" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><path d="M1330,905 L1330,965" stroke="#8ba8c9" stroke-width="3" fill="none" marker-end="url(#a)"/><text x="60" y="1070" class="n">*Policy rules apply to conditional permissions; direct ALLOW still undergoes contextual risk. Prior core reused.</text></svg>