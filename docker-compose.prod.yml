# Production compose. Not a drop-in override of docker-compose.yml (the
# service shapes differ too much -- no host port on postgres, a different
# build target, no bind-mounted source) so it is a standalone file:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# All secrets are expected to come from real environment/secret injection
# at deploy time (see .env.example) -- this file has no defaults for any
# of them, so a missing value fails the compose run rather than silently
# falling back to something insecure.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Deliberately no host port mapping -- only reachable from other
    # containers on this compose network, not from the host.

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: production
    restart: unless-stopped
    environment:
      SAFEOPS_ENV: production
      SAFEOPS_DEMO_MODE: "false"
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required, e.g. ["https://ops.example.com"]}
      SAFEOPS_BOOTSTRAP_ADMIN_TOKEN: ${SAFEOPS_BOOTSTRAP_ADMIN_TOKEN:?SAFEOPS_BOOTSTRAP_ADMIN_TOKEN is required}
      SAFEOPS_BOOTSTRAP_ADMIN_USERNAME: ${SAFEOPS_BOOTSTRAP_ADMIN_USERNAME:-admin}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
